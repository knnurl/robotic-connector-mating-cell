# Configuration for mating_panel.py — edit freely, no code changes needed.
title: Connector Mating Cell

# --- Topics ------------------------------------------------------------
phase_topic: /mating/phase
paused_topic: /mating/paused        # latched Bool; panel shows PAUSED overlay
error_pos_topic: /mating/error_mm
error_rot_topic: /mating/error_deg
image_topic: /aruco/debug_image     # set to '' to disable the camera view
image_max_width: 480

# --- Display -----------------------------------------------------------
# Tolerance lines on the plots (match fine_pos_tol_m / fine_rot_tol_deg
# in rv5as_params.yaml — values here are mm / deg).
pos_tol_mm: 2.5
rot_tol_deg: 1.0
plot_seconds: 30
refresh_hz: 10
stale_after_s: 3.0     # mark the phase display when no data arrives

# Validated dark-surface palette (status + categorical steps).
phase_colors:
  WAIT_FOR_VISION: '#52514e'   # neutral — idle
  PAUSED: '#3987e5'            # blue — informational hold
  ALIGN_COARSE: '#c98500'      # amber — working (coarse)
  ALIGN_FINE: '#eda100'        # brighter amber — working (fine)
  INSERT: '#ec835a'            # orange — committing the stroke (attention)
  MATED: '#0ca30c'             # green — success
  FAULT: '#d03b3b'             # red — fault

# --- Buttons -----------------------------------------------------------
# type: service_trigger -> calls a std_srvs/Trigger service
# type: param_toggle    -> flips a boolean parameter on a node
# STOP halts the trajectory immediately and latches FAULT (reset to
# recover). It is an OPERATIONAL stop - the hardware e-stop remains the
# only safety-rated stop on the cell.
buttons:
  - label: "STOP"
    type: service_trigger
    service: /connector_mating_node/stop
    color: '#b22222'
    text_color: white
  - label: Pause
    type: service_trigger
    service: /connector_mating_node/pause
    color: '#4682b4'
    text_color: white
  - label: Resume
    type: service_trigger
    service: /connector_mating_node/resume
    color: '#2e8b57'
    text_color: white
  - label: Retract
    type: service_trigger
    service: /connector_mating_node/retract
    color: '#c98500'
    text_color: white
  - label: RESET sequence
    type: service_trigger
    service: /connector_mating_node/reset
  - label: Toggle insertion enable
    type: param_toggle
    node: /connector_mating_node
    param: enable_insertion
