# One entry point for the Python tests: `python3 -m pytest` from here.
# tools/run_tests.sh runs this after the colcon build and tests.
[pytest]
testpaths = tools/fr3 roscam/test
norecursedirs = build install log melfa graphify-out
pythonpath = roscam
# No .pytest_cache in the source tree.
addopts = -p no:cacheprovider
