# moveit_servo configuration for servo-mode alignment on the FR3.
#
# Used only when fr3_params.yaml sets `align_mode: servo`. The mating
# controller publishes TwistStamped commands (in the planning frame) on
# /servo_node/delta_twist_cmds each control cycle; moveit_servo turns them
# into smooth joint streaming. INSERT remains a discrete committed stroke
# executed via move_group - the controller publishes a zero twist before
# committing so servo holds while the stroke runs.
#
# Prerequisites (NOT installed on this PC yet):
#   sudo apt install ros-humble-moveit-servo
# Run (after the FR3 driver + move_group are up):
#   ros2 run moveit_servo servo_node_main --ros-args \
#       --params-file tools/fr3/fr3_servo.yaml \
#       -p robot_description:=... (or remap to the shared description)
# Controller side: align_mode: servo, control_period_s: 0.05 (must be
# shorter than incoming_command_timeout below).
#
# UNVERIFIED at runtime - moveit_servo is not installed on this machine.
# Validate in fake hardware first (setup guide section 4).

/servo_node:
  ros__parameters:
    moveit_servo:
      use_gazebo: false
      command_in_type: "speed_units"      # twists are m/s and rad/s
      scale:
        linear: 1.0
        rotational: 1.0
      publish_period: 0.01                # 100 Hz output
      incoming_command_timeout: 0.2       # > controller control_period_s
      num_outgoing_halt_msgs_to_publish: 4

      # Stream joint POSITIONS to a forward position controller, NOT a
      # trajectory to the effort-mode fr3_arm_controller: that controller
      # re-seeds from the measured position every 10 ms, which left the arm
      # stalled at 12.7 mm while servo commanded 10 mm/s, and made the
      # 100 Hz torque steps audible (measured 2026-09-15). Positions are
      # tracked by the robot's own joint-impedance controller instead.
      # See fr3_servo_controllers.yaml; cell_panel switches controllers
      # around each servo run.
      command_out_type: std_msgs/Float64MultiArray
      command_out_topic: /fr3_servo_position_controller/commands
      publish_joint_positions: true
      publish_joint_velocities: false
      publish_joint_accelerations: false

      move_group_name: fr3_arm
      planning_frame: fr3_link0
      robot_link_command_frame: fr3_link0  # controller twists are in this frame
      ee_frame_name: fr3_hand_tcp

      joint_topic: /joint_states
      status_topic: ~/status

      # Safety: singularity/collision aware scaling.
      lower_singularity_threshold: 17.0
      hard_stop_singularity_threshold: 30.0
      joint_limit_margin: 0.1
      check_collisions: true
      collision_check_rate: 10.0
      self_collision_proximity_threshold: 0.01
      scene_collision_proximity_threshold: 0.02

      smoothing_filter_plugin_name: "online_signal_smoothing::ButterworthFilterPlugin"
      low_pass_filter_coeff: 2.0
