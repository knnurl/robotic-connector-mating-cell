# Controller that moveit_servo streams into, on the JOINT POSITION interface.
#
# Why not the arm's normal controller: fr3_arm_controller is a trajectory
# controller on the EFFORT interface. Servo replaces its trajectory every
# 10 ms and every one of those is seeded at the measured position, so the
# tracking error - and with it the commanded torque - stays tiny. Measured on
# this cell 2026-09-15: a conservative servo run commanded ~10 mm/s and
# 7 deg/s for 90 s while the arm did not move at all (error flat at 12.7 mm /
# 8.8 deg), and at higher speeds the 100 Hz torque steps were clearly
# audible. Streaming positions instead hands tracking to the robot's own
# joint-impedance controller inside libfranka, which is what it is for.
#
# Loaded INACTIVE by fr3_servo.launch.py; cell_panel activates it (and
# deactivates fr3_arm_controller) only for the duration of a servo run, then
# always switches back. The two cannot run together: franka_hardware allows
# exactly one command mode at a time.
#
# Safe to activate: a forward controller writes nothing until its first
# command arrives, and franka_hardware seeds the position command from the
# measured joints on every read while first_position_update_ is set - so
# activation cannot command a jump. If the stream stops, the last commanded
# position simply holds.
#
# Joint ORDER must match the order moveit_servo publishes, which is the
# fr3_arm group order in the SRDF (joint 1..7). A mismatch would map
# commands onto the wrong joints.
/**:
  fr3_servo_position_controller:
    ros__parameters:
      joints:
        - fr3_joint1
        - fr3_joint2
        - fr3_joint3
        - fr3_joint4
        - fr3_joint5
        - fr3_joint6
        - fr3_joint7
