# Gain presets for the detented slider, ordered SOFT -> STIFF. Every gain must
# be monotonic across the stops (checked at load and by test_cell_logic.py);
# values must sit inside the controller's GainLimits and zeta <= 1.0
# (fr3_mating_controllers README: do not raise zeta above 1.0).
#
# commission, firm and stiff are the user's values (2026-09-24); soft is still
# a PLACEHOLDER. The controller launches with its own yaml gains (150/800/10/20,
# measured 2026-09-16/22) until the panel writes a preset or the saved gains.
#
# k_xy  = k_pos_tool[0,1] N/m     k_z  = k_pos_tool[2] N/m
# k_rp  = k_rot_tool[0,1] Nm/rad  k_yaw = k_rot_tool[2] Nm/rad
# zeta  = damping_ratio
presets:
  - {name: soft,       k_xy: 100.0, k_z: 500.0,  k_rp: 5.0,  k_yaw: 10.0, zeta: 1.0, placeholder: true}
  - {name: commission, k_xy: 300.0, k_z: 800.0,  k_rp: 20.0, k_yaw: 30.0, zeta: 1.0, placeholder: false}
  - {name: firm,       k_xy: 800.0, k_z: 1200.0, k_rp: 50.0, k_yaw: 50.0, zeta: 0.9, placeholder: false}
  - {name: stiff,      k_xy: 1800.0, k_z: 1800.0, k_rp: 80.0, k_yaw: 80.0, zeta: 0.8, placeholder: false}
default: commission
