# Gain presets for the detented slider, ordered SOFT -> STIFF. Every gain must
# be monotonic across the stops (checked at load and by test_v2_logic.py);
# values must sit inside the controller's GainLimits and zeta <= 1.0
# (fr3_mating_controllers README: do not raise zeta above 1.0).
#
# Only "commission" is measured: the Tk panel's values, run on the arm 2026-09-16/22.
# Every other preset is a PLACEHOLDER for the user to tune on the cell.
#
# k_xy  = k_pos_tool[0,1] N/m     k_z  = k_pos_tool[2] N/m
# k_rp  = k_rot_tool[0,1] Nm/rad  k_yaw = k_rot_tool[2] Nm/rad
# zeta  = damping_ratio
presets:
  - {name: soft,       k_xy: 100.0, k_z: 500.0,  k_rp: 5.0,  k_yaw: 10.0, zeta: 1.0, placeholder: true}
  - {name: commission, k_xy: 150.0, k_z: 800.0,  k_rp: 10.0, k_yaw: 20.0, zeta: 1.0, placeholder: false}
  - {name: firm,       k_xy: 300.0, k_z: 1200.0, k_rp: 20.0, k_yaw: 30.0, zeta: 0.9, placeholder: true}
  - {name: stiff,      k_xy: 600.0, k_z: 1500.0, k_rp: 40.0, k_yaw: 60.0, zeta: 0.8, placeholder: true}
default: commission
