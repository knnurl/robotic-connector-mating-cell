# The 55 mm test cube (the black block under it is a stand, not the part).
# Read by roscam.object_pose.load_part.
#
# Object frame = the mesh's own frame: origin at the top-face centre, Z out
# of the top face (toward the camera when it looks down on the cube). A
# connector's file names an STL instead of box_mm, exported with its origin
# at the mate point and Z out of the mating face:
#   mesh: {stl: connector.stl, scale: 0.001}   # STL units -> metres
name: cube55
mesh:
  box_mm: [55.0, 55.0, 55.0]
# Resting on a face, the cube looks the same after every 90 deg about Z;
# the estimator returns the equivalent pose nearest its prior.
symmetry:
  axis: z
  order: 4
# Marker id 0's pose on the cube: the sticker's offset and rotation from the
# top-face centre, marker frame -> object frame. NOT MEASURED YET: calipers
# and a square on the cube (PERCEPTION_PLAN Phase 0). Until then identity,
# i.e. the sticker taken as centred and square, so replay_eval reports the
# implied offset instead of a bias.
T_marker_object:
  xyz_mm: [0.0, 0.0, 0.0]
  rpy_deg: [0.0, 0.0, 0.0]
  measured: false
