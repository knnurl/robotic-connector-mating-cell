# ros2_control configuration for the FR3 dry run.
# Position-mode trajectory controller (the stock franka effort controller
# cannot move fake_components/GenericSystem, which doesn't integrate torques).
controller_manager:
  ros__parameters:
    update_rate: 500

    fr3_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

fr3_arm_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    joints:
      - fr3_joint1
      - fr3_joint2
      - fr3_joint3
      - fr3_joint4
      - fr3_joint5
      - fr3_joint6
      - fr3_joint7
